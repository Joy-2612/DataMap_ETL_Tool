name: Cursor Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  code-review:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require CURSOR_API_KEY
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "ERROR: CURSOR_API_KEY secret is not set. Aborting job." >&2
            exit 1
          fi

      - name: Validate .cursor/rules folder and rule files
        run: |
          echo "=== Validating .cursor/rules directory ==="
          if [ ! -d ".cursor/rules" ]; then
            echo "❌ ERROR: .cursor/rules directory not found"
            exit 1
          fi

          # Count all .mdc files recursively (including subdirectories)
          TOTAL_MDC_COUNT=$(find .cursor/rules -name "*.mdc" -type f | wc -l)
          if [ "$TOTAL_MDC_COUNT" -eq 0 ]; then
            echo "❌ ERROR: No .mdc rule files found"
            exit 1
          fi

          # Check for empty files
          if find .cursor/rules -name "*.mdc" -type f -empty | grep -q .; then
            echo "❌ ERROR: Found empty .mdc files"
            exit 1
          fi

          echo "✅ Found $TOTAL_MDC_COUNT rule files"

      - name: Install Cursor CLI
        run: |
          if ! curl --fail --silent --show-error --location https://cursor.com/install | bash; then
            echo "❌ Failed to install Cursor CLI"
            exit 1
          fi
          echo "$HOME/.cursor/bin" >> $GITHUB_PATH

      - name: Verify Installation and Debug Auth
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          export PATH="$HOME/.cursor/bin:$PATH"
          echo "Cursor CLI version:"
          cursor-agent --version || { echo "❌ Cursor CLI not properly installed"; exit 1; }
          echo "Testing authentication..."
          cursor-agent status || echo "Auth status failed - this is expected in CI"
          echo "API key length: ${#CURSOR_API_KEY}"

      - name: Generate latest commit diff
        id: latest_diff
        run: |
          git fetch --deepen=2
          PREV_COMMIT=$(git rev-parse HEAD~1)
          LATEST_COMMIT=$(git rev-parse HEAD)
          git diff $PREV_COMMIT $LATEST_COMMIT > latest.diff

      - name: Perform code review with custom rules
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export PATH="$HOME/.cursor/bin:$PATH"
          DIFF_CONTENT=$(cat latest.diff)

          # Debug: Check diff size and content
          echo "🔍 DEBUGGING: Analyzing diff content"
          echo "📊 Diff size: $(echo "$DIFF_CONTENT" | wc -c) characters"
          echo "📊 Diff lines: $(echo "$DIFF_CONTENT" | wc -l) lines"
          echo "📊 Added lines: $(echo "$DIFF_CONTENT" | grep -c "^+" || echo "0")"
          echo "📊 Removed lines: $(echo "$DIFF_CONTENT" | grep -c "^-" || echo "0")"

          # Check if diff is empty
          if [ -z "$DIFF_CONTENT" ]; then
            echo "⚠️  WARNING: Empty diff detected - no changes to review"
            exit 0
          fi

          # Check if diff is too large
          DIFF_SIZE=$(echo "$DIFF_CONTENT" | wc -c)
          if [ "$DIFF_SIZE" -gt 50000 ]; then
            echo "⚠️  WARNING: Large diff ($DIFF_SIZE chars) - may cause resource exhaustion"
            # Truncate diff to manageable size
            DIFF_CONTENT=$(echo "$DIFF_CONTENT" | head -500)
            echo "📝 Truncated diff to $(echo "$DIFF_CONTENT" | wc -l) lines"
          fi

          # Debug: API Key validation
          echo "🔑 DEBUGGING: API Key validation"
          echo "📊 API key length: ${#CURSOR_API_KEY}"
          if [ ${#CURSOR_API_KEY} -lt 20 ]; then
            echo "❌ ERROR: API key appears too short (${#CURSOR_API_KEY} chars)"
            exit 1
          fi

          # Debug: Cursor CLI status
          echo "🖥️  DEBUGGING: Cursor CLI status"
          echo "📍 Cursor CLI path: $(which cursor-agent || echo 'NOT FOUND')"
          echo "🔧 Cursor CLI version: $(cursor-agent --version 2>&1 || echo 'VERSION CHECK FAILED')"

          # Test basic connectivity
          echo "🌐 DEBUGGING: Testing Cursor connectivity"
          if ! cursor-agent status 2>&1; then
            echo "⚠️  WARNING: Cursor status check failed (expected in CI)"
          fi

          REVIEW_INSTRUCTIONS="GitHub Actions PR Review Context:
          - Repository: ${{ github.repository }}
          - PR Number: ${{ github.event.pull_request.number }}
          - Request ID: $(date +%s)

          --- BEGIN DIFF ---
          $DIFF_CONTENT
          --- END DIFF ---"

          # Debug: Instruction size
          INSTRUCTION_SIZE=${#REVIEW_INSTRUCTIONS}
          echo "📊 Review instruction size: $INSTRUCTION_SIZE characters"

          if [ "$INSTRUCTION_SIZE" -gt 100000 ]; then
            echo "⚠️  WARNING: Review instructions very large ($INSTRUCTION_SIZE chars)"
          fi

          MODELS=("auto" "claude-4-sonnet" "gpt-5" "sonnet-4.5" "cheetah")
          SUCCESS=0
          ATTEMPT=0

          # Run code review with detailed error handling
          for MODEL in "${MODELS[@]}"; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "🚀 ATTEMPT $ATTEMPT: Running code review with model: $MODEL"
            echo "⏰ Start time: $(date)"
            
            # Add timeout and capture full error output
            timeout 60s cursor-agent \
              --force \
              --model "$MODEL" \
              --output-format=text \
              --print "$REVIEW_INSTRUCTIONS" 2>&1 | tee "cursor_output_$MODEL.log"
            
            CURSOR_EXIT_CODE=${PIPESTATUS[0]}
            echo "📊 Cursor exit code: $CURSOR_EXIT_CODE"
            echo "⏰ End time: $(date)"
            
            # Analyze the specific error
            if [ $CURSOR_EXIT_CODE -eq 0 ]; then
              echo "✅ Code review success with model: $MODEL"
              SUCCESS=1
              break
            elif [ $CURSOR_EXIT_CODE -eq 124 ]; then
              echo "⏰ TIMEOUT: Model $MODEL took longer than 60 seconds"
              echo "🔍 This suggests either:"
              echo "   - Network connectivity issues"
              echo "   - Model is overloaded"
              echo "   - Input is too complex"
            else
              echo "❌ FAILED: Model $MODEL failed with exit code: $CURSOR_EXIT_CODE"
              
              # Analyze specific error patterns
              if grep -q "resource_exhausted" "cursor_output_$MODEL.log"; then
                echo "💰 RESOURCE EXHAUSTED detected for model: $MODEL"
                echo "🔍 Possible causes:"
                echo "   - Monthly quota exceeded"
                echo "   - Rate limit hit"
                echo "   - Request too large"
                echo "   - Account suspended"
                
                # Check if it's a quota vs rate limit issue
                if grep -q "quota" "cursor_output_$MODEL.log"; then
                  echo "📊 QUOTA ISSUE: Monthly usage limit reached"
                elif grep -q "rate" "cursor_output_$MODEL.log"; then
                  echo "🚄 RATE LIMIT: Too many requests per minute"
                  echo "💤 Adding 10-second delay before next attempt..."
                  sleep 10
                fi
              elif grep -q "authentication" "cursor_output_$MODEL.log"; then
                echo "🔐 AUTHENTICATION ERROR detected"
                echo "🔍 Check if API key is valid and not expired"
              elif grep -q "connection" "cursor_output_$MODEL.log"; then
                echo "🌐 CONNECTION ERROR detected"
                echo "🔍 Network connectivity issue"
              fi
              
              # Show last few lines of error output
              echo "📝 Last 5 lines of error output:"
              tail -5 "cursor_output_$MODEL.log" 2>/dev/null || echo "No error log available"
            fi
            
            # Add progressive delay between attempts
            if [ $ATTEMPT -lt ${#MODELS[@]} ]; then
              DELAY=$((ATTEMPT * 5))
              echo "💤 Waiting ${DELAY}s before next attempt..."
              sleep $DELAY
            fi
          done

          echo ""
          echo "📊 FINAL DEBUG SUMMARY:"
          echo "   Total attempts: $ATTEMPT"
          echo "   Success: $([ $SUCCESS -eq 1 ] && echo 'YES' || echo 'NO')"
          echo "   Available log files: $(ls cursor_output_*.log 2>/dev/null | tr '\n' ' ')"

          if [ "$SUCCESS" -ne 1 ]; then
            echo ""
            echo "❌ ERROR: Code review failed with all models"
            echo "🔍 Debugging information collected:"
            echo "   - API key length: ${#CURSOR_API_KEY} characters"
            echo "   - Diff size: $DIFF_SIZE characters"
            echo "   - Instruction size: $INSTRUCTION_SIZE characters"
            echo "   - Models tried: ${MODELS[*]}"
            
            # Suggest solutions based on patterns
            echo ""
            echo "🛠️  SUGGESTED SOLUTIONS:"
            if grep -l "resource_exhausted" cursor_output_*.log 2>/dev/null; then
              echo "   1. Upgrade Cursor subscription (most likely cause)"
              echo "   2. Wait for quota reset (if monthly limit)"
              echo "   3. Reduce diff size by making smaller commits"
            fi
            if grep -l "authentication" cursor_output_*.log 2>/dev/null; then
              echo "   1. Verify CURSOR_API_KEY secret is correct"
              echo "   2. Check if API key has expired"
              echo "   3. Regenerate API key from Cursor settings"
            fi
            
            exit 1
          fi

          # Cleanup log files on success
          rm -f cursor_output_*.log 2>/dev/null || true

      - name: Generate and update architecture documentation
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          export PATH="$HOME/.cursor/bin:$PATH"
          DIFF_CONTENT=$(cat latest.diff)

          # Check if architecture.md exists and read it
          EXISTING_ARCH=""
          if [ -f "architecture.md" ]; then
            EXISTING_ARCH=$(cat architecture.md)
            echo "📄 Found existing architecture.md ($(wc -w < architecture.md) words)"
          else
            echo "📄 No existing architecture.md - creating new file"
          fi

          Repository: ${{ github.repository }}
          PR Number: ${{ github.event.pull_request.number }}

          EXISTING ARCHITECTURE CONTENT:
          $EXISTING_ARCH

          RECENT CHANGES TO ANALYZE:
          --- BEGIN DIFF ---
          $DIFF_CONTENT
          --- END DIFF ---

          TASK: Generate complete architecture.md content based on current repository state.
          If existing content exists, enhance and expand it. If not, create from scratch.

          OUTPUT FORMAT: Start immediately with markdown content, no preamble."

          MODELS=("auto" "claude-3-5-sonnet" "gpt-4" "sonnet-4.5")
          SUCCESS=0

          # Run architecture generation with quality validation
          for MODEL in "${MODELS[@]}"; do
            echo "Generating architecture with model: $MODEL"
            
            if ARCH_CONTENT=$(cursor-agent --force --model "$MODEL" --max-tokens=8000 --temperature=0.2 --output-format=text --print "$ARCH_INSTRUCTIONS"); then
              
              # Quality validation
              WORD_COUNT=$(echo "$ARCH_CONTENT" | wc -w)
              MERMAID_COUNT=$(echo "$ARCH_CONTENT" | grep -c "```
              HAS_CONVERSATIONAL=$(echo "$ARCH_CONTENT" | grep -i -E "(good|let me|i can|perfect|here's)" | head -1 || true)
              
              echo "Validation for $MODEL:"
              echo "  📊 Words: $WORD_COUNT"
              echo "  📈 Mermaid diagrams: $MERMAID_COUNT"
              echo "  🚫 Conversational text: $([ -n "$HAS_CONVERSATIONAL" ] && echo 'DETECTED' || echo 'NONE')"
              
              # Quality checks
              if [ $WORD_COUNT -gt 2000 ] && [ $MERMAID_COUNT -ge 1 ] && [ -z "$HAS_CONVERSATIONAL" ] && [[ "$ARCH_CONTENT" == "# System Architecture"* ]]; then
                echo "$ARCH_CONTENT" > architecture.md
                echo "✅ Quality architecture generated with $MODEL"
                SUCCESS=1
                break
              else
                echo "❌ Quality validation failed with $MODEL"
              fi
            else
              echo "❌ Architecture generation failed with $MODEL"
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "⚠️  Architecture generation failed with all models"
            if [ -f "architecture.md" ]; then
              echo "📄 Preserving existing architecture.md file"
            else
              echo "❌ No architecture.md generated and no existing file"
              exit 1
            fi
          fi

      - name: Auto-commit architecture changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: Update architecture.md for PR #${{ github.event.pull_request.number }}"
          file_pattern: "architecture.md"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          skip_dirty_check: false
          skip_fetch: false
